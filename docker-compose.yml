version: '3.8'

networks:
  app-network:
    driver: bridge

services:
  web:
    build: .
    environment:
      - MONGO_URI=mongodb://mongo:27017/user_db
    depends_on:
      - mongo
    networks:
      - app-network
    restart: unless-stopped

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    networks:
      - app-network
    command: mongod --quiet --logpath /dev/null 
    restart: unless-stopped
  
  nginx:
    image: nginx:latest
    ports:
      - "80:17071"
    volumes:
      - ./nginx:/etc/nginx
    depends_on:
      - web
    networks:
      - app-network
    healthcheck:
      test: curl --fail http://localhost:17071/health || exit 1
      interval: 120s
      retries: 3
      start_period: 20s
      timeout: 10s
    

volumes:
  mongo-data:
